[build-system]
requires = ["jupyterlite-core>=0.2.0,<0.3.0"]
build-backend = "jupyterlite_core.build"

[project]
name = "generative-information-physics"
version = "1.0.0"
description = "Generative Information Physics Framework - Interactive Notebooks"
license = { text = "MIT" }
authors = [
    { name = "Jun Kawasaki", email = "root+physics@junkawasaki.com" }
]

[tool.jupyterlite.contents]
packages = [
    "numpy", 
    "scipy", 
    "matplotlib", 
    "pandas",
    "seaborn",
    "h5py",
    "astropy"
]

[tool.jupyterlite.lab]
title = "生成的情報物理学研究フレームワーク"
favicon = "favicon.ico"
