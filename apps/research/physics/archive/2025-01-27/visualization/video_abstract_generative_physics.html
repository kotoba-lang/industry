<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生成物理学: 情報処理を通じた宇宙進化の統一理論</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            overflow: hidden;
        }
        
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #canvas {
            border: 2px solid #3498db;
            box-shadow: 0 0 30px rgba(52, 152, 219, 0.3);
            background: radial-gradient(circle at center, #001122 0%, #000000 70%);
        }
        
        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #3498db;
        }
        
        button {
            background: linear-gradient(45deg, #3498db, #2ecc71);
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }
        
        .info-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #3498db;
            text-align: center;
            z-index: 1000;
        }
        
        .equation {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            color: #2ecc71;
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(46, 204, 113, 0.5);
        }
        
        .concept-title {
            font-size: 24px;
            color: #3498db;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(52, 152, 219, 0.5);
        }
        
        .phase-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid #e74c3c;
            color: #e74c3c;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="canvas" width="1200" height="800"></canvas>
        
        <div class="controls">
            <button onclick="startAnimation()">開始</button>
            <button onclick="pauseAnimation()">停止</button>
            <button onclick="resetAnimation()">リセット</button>
            <button onclick="nextPhase()">次の段階</button>
        </div>
        
        <div class="phase-indicator" id="phaseIndicator">
            Phase 1: 情報密度の初期化
        </div>
        
        <div class="info-panel" id="infoPanel">
            <div class="concept-title">生成物理学: 情報処理を通じた宇宙進化の統一理論</div>
            <div class="equation" id="currentEquation">
                ∂ρ_I/∂t + ∇·(ρ_I v_I) = Γ_gen - Γ_decay
            </div>
            <div id="conceptDescription">
                情報密度 ρ_I(x,t) が宇宙の基本的な物理量として進化します。
                情報生成率 Γ_gen と情報崩壊率 Γ_decay のバランスが宇宙の構造を決定します。
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        
        // Animation variables
        let animationId;
        let isRunning = false;
        let frame = 0;
        let currentPhase = 0;
        let time = 0;
        
        // Physics simulation variables
        let informationField = [];
        let quantumStates = [];
        let spaceTimeMetric = [];
        let cosmologicalParameters = {
            H0: 67.66,
            sigma8: 0.8111,
            omega_m: 0.3153,
            omega_lambda: 0.6847
        };
        
        // Animation phases
        const phases = [
            {
                name: "情報密度の初期化",
                equation: "∂ρ_I/∂t + ∇·(ρ_I v_I) = Γ_gen - Γ_decay",
                description: "情報密度 ρ_I(x,t) が宇宙の基本的な物理量として進化します。情報生成率 Γ_gen と情報崩壊率 Γ_decay のバランスが宇宙の構造を決定します。"
            },
            {
                name: "時空の創発",
                equation: "g_μν = η_μν + α ∫ G(x-x') δρ_I(x') d⁴x'",
                description: "時空の計量テンソル g_μν が情報密度の揺らぎから創発します。情報-幾何学結合定数 α が時空の曲率を決定します。"
            },
            {
                name: "量子計算ダイナミクス",
                equation: "|ψ(t+dt)⟩ = U_computation(dt) |ψ(t)⟩",
                description: "宇宙の各プランクスケール体積要素が量子計算アルゴリズムを実行します。計算複雑性が宇宙進化の速度を決定します。"
            },
            {
                name: "宇宙論的緊張の解決",
                equation: "σ₈ = 0.834 ± 0.012 (統一値)",
                description: "σ₈問題とH₀問題が情報理論的アプローチにより解決されます。物質パワースペクトルが情報-物質転送関数により説明されます。"
            },
            {
                name: "構造形成と意識の創発",
                equation: "C(t) = C₀ e^(H₀t) [1 + α sin(ω_info t)]",
                description: "宇宙の計算複雑性が指数的に増大し、情報処理能力の向上が構造形成と意識の創発を可能にします。"
            }
        ];
        
        // Initialize simulation
        function initializeSimulation() {
            // Initialize information field
            informationField = [];
            for (let i = 0; i < 50; i++) {
                for (let j = 0; j < 50; j++) {
                    informationField.push({
                        x: (i / 50) * width,
                        y: (j / 50) * height,
                        density: Math.random() * 0.5 + 0.5,
                        velocity: {
                            x: (Math.random() - 0.5) * 2,
                            y: (Math.random() - 0.5) * 2
                        },
                        phase: Math.random() * Math.PI * 2
                    });
                }
            }
            
            // Initialize quantum states
            quantumStates = [];
            for (let i = 0; i < 200; i++) {
                quantumStates.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    amplitude: Math.random(),
                    phase: Math.random() * Math.PI * 2,
                    frequency: Math.random() * 0.1 + 0.05
                });
            }
            
            // Initialize spacetime metric
            spaceTimeMetric = [];
            for (let i = 0; i < width; i += 20) {
                for (let j = 0; j < height; j += 20) {
                    spaceTimeMetric.push({
                        x: i,
                        y: j,
                        curvature: 0
                    });
                }
            }
        }
        
        // Animation functions
        function drawInformationField() {
            ctx.globalAlpha = 0.6;
            
            for (let i = 0; i < informationField.length; i++) {
                const field = informationField[i];
                const intensity = field.density * (1 + 0.3 * Math.sin(field.phase + time * 0.1));
                
                // Create gradient for information density
                const gradient = ctx.createRadialGradient(
                    field.x, field.y, 0,
                    field.x, field.y, 15
                );
                gradient.addColorStop(0, `rgba(46, 204, 113, ${intensity})`);
                gradient.addColorStop(1, 'rgba(46, 204, 113, 0)');
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(field.x, field.y, 8 * intensity, 0, Math.PI * 2);
                ctx.fill();
                
                // Update field evolution
                field.phase += field.frequency * 0.1;
                field.x += field.velocity.x * 0.5;
                field.y += field.velocity.y * 0.5;
                
                // Boundary conditions
                if (field.x < 0 || field.x > width) field.velocity.x *= -1;
                if (field.y < 0 || field.y > height) field.velocity.y *= -1;
            }
            
            ctx.globalAlpha = 1.0;
        }
        
        function drawQuantumStates() {
            ctx.globalAlpha = 0.8;
            
            for (let i = 0; i < quantumStates.length; i++) {
                const state = quantumStates[i];
                const waveFunction = state.amplitude * Math.sin(state.phase + time * state.frequency);
                
                if (waveFunction > 0) {
                    ctx.fillStyle = `rgba(52, 152, 219, ${waveFunction * 0.8})`;
                    ctx.beginPath();
                    ctx.arc(state.x, state.y, 3 + waveFunction * 5, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                // Quantum state evolution
                state.phase += state.frequency;
                state.x += Math.cos(state.phase) * 0.5;
                state.y += Math.sin(state.phase) * 0.5;
                
                // Quantum tunneling (boundary conditions)
                if (state.x < 0) state.x = width;
                if (state.x > width) state.x = 0;
                if (state.y < 0) state.y = height;
                if (state.y > height) state.y = 0;
            }
            
            ctx.globalAlpha = 1.0;
        }
        
        function drawSpaceTimeMetric() {
            ctx.globalAlpha = 0.4;
            ctx.strokeStyle = 'rgba(231, 76, 60, 0.6)';
            ctx.lineWidth = 1;
            
            for (let i = 0; i < spaceTimeMetric.length; i++) {
                const metric = spaceTimeMetric[i];
                
                // Calculate curvature based on nearby information density
                let totalDensity = 0;
                let count = 0;
                
                for (let j = 0; j < informationField.length; j++) {
                    const field = informationField[j];
                    const distance = Math.sqrt((metric.x - field.x) ** 2 + (metric.y - field.y) ** 2);
                    if (distance < 50) {
                        totalDensity += field.density / (distance + 1);
                        count++;
                    }
                }
                
                metric.curvature = count > 0 ? totalDensity / count : 0;
                
                // Draw curved spacetime grid
                const curvatureEffect = metric.curvature * 10;
                ctx.beginPath();
                ctx.moveTo(metric.x - curvatureEffect, metric.y);
                ctx.lineTo(metric.x + curvatureEffect, metric.y);
                ctx.moveTo(metric.x, metric.y - curvatureEffect);
                ctx.lineTo(metric.x, metric.y + curvatureEffect);
                ctx.stroke();
            }
            
            ctx.globalAlpha = 1.0;
        }
        
        function drawCosmologicalEvolution() {
            // Draw Hubble parameter evolution
            ctx.strokeStyle = 'rgba(155, 89, 182, 0.8)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            
            for (let x = 0; x < width; x += 5) {
                const t = (x / width) * 13.8; // Age of universe in Gyr
                const H = cosmologicalParameters.H0 * Math.sqrt(
                    cosmologicalParameters.omega_m * Math.pow(1 + (t / 13.8) * 10, 3) +
                    cosmologicalParameters.omega_lambda
                );
                const y = height - (H / 100) * height * 0.5;
                
                if (x === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.stroke();
            
            // Draw sigma8 evolution
            ctx.strokeStyle = 'rgba(241, 196, 15, 0.8)';
            ctx.beginPath();
            
            for (let x = 0; x < width; x += 5) {
                const z = (1 - x / width) * 1100; // Redshift
                const growthFactor = Math.pow(1 + z, -0.8);
                const sigma8_z = cosmologicalParameters.sigma8 * growthFactor;
                const y = height - sigma8_z * height * 0.6;
                
                if (x === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.stroke();
        }
        
        function drawPhaseSpecificContent() {
            switch (currentPhase) {
                case 0:
                    drawInformationField();
                    break;
                case 1:
                    drawInformationField();
                    drawSpaceTimeMetric();
                    break;
                case 2:
                    drawInformationField();
                    drawSpaceTimeMetric();
                    drawQuantumStates();
                    break;
                case 3:
                    drawInformationField();
                    drawSpaceTimeMetric();
                    drawCosmologicalEvolution();
                    break;
                case 4:
                    drawInformationField();
                    drawSpaceTimeMetric();
                    drawQuantumStates();
                    drawCosmologicalEvolution();
                    break;
            }
        }
        
        function updateInfoPanel() {
            const phase = phases[currentPhase];
            document.getElementById('phaseIndicator').textContent = `Phase ${currentPhase + 1}: ${phase.name}`;
            document.getElementById('currentEquation').textContent = phase.equation;
            document.getElementById('conceptDescription').textContent = phase.description;
        }
        
        function animate() {
            if (!isRunning) return;
            
            // Clear canvas
            ctx.clearRect(0, 0, width, height);
            
            // Draw background grid
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i < width; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, height);
                ctx.stroke();
            }
            for (let j = 0; j < height; j += 40) {
                ctx.beginPath();
                ctx.moveTo(0, j);
                ctx.lineTo(width, j);
                ctx.stroke();
            }
            
            // Draw phase-specific content
            drawPhaseSpecificContent();
            
            // Update time and frame
            time += 0.1;
            frame++;
            
            // Auto-advance phases
            if (frame % 600 === 0) {
                nextPhase();
            }
            
            animationId = requestAnimationFrame(animate);
        }
        
        // Control functions
        function startAnimation() {
            if (!isRunning) {
                isRunning = true;
                animate();
            }
        }
        
        function pauseAnimation() {
            isRunning = false;
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
        }
        
        function resetAnimation() {
            pauseAnimation();
            frame = 0;
            time = 0;
            currentPhase = 0;
            initializeSimulation();
            updateInfoPanel();
            ctx.clearRect(0, 0, width, height);
        }
        
        function nextPhase() {
            currentPhase = (currentPhase + 1) % phases.length;
            updateInfoPanel();
        }
        
        // Initialize
        initializeSimulation();
        updateInfoPanel();
        startAnimation();
    </script>
</body>
</html>
