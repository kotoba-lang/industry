<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cytoscape Test</title>
    <style>
        #cy {
            width: 100%;
            height: 400px;
            background: #f0f0f0;
            border: 2px solid #333;
        }
    </style>
</head>
<body>
    <h1>Cytoscape Test Page</h1>
    <div id="cy"></div>
    
    <script>
        console.log('Test page loaded');
    </script>
    <script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
    <script>
        console.log('Cytoscape script loaded, available:', typeof cytoscape !== 'undefined');
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, initializing test...');
            
            try {
                const cy = cytoscape({
                    container: document.getElementById('cy'),
                    elements: [
                        { data: { id: 'a', label: 'Node A' } },
                        { data: { id: 'b', label: 'Node B' } },
                        { data: { id: 'c', label: 'Node C' } },
                        { data: { source: 'a', target: 'b' } },
                        { data: { source: 'b', target: 'c' } }
                    ],
                    style: [
                        {
                            selector: 'node',
                            style: {
                                'background-color': '#666',
                                'label': 'data(label)',
                                'color': 'white',
                                'text-valign': 'center',
                                'text-halign': 'center'
                            }
                        },
                        {
                            selector: 'edge',
                            style: {
                                'width': 3,
                                'line-color': '#ccc',
                                'target-arrow-color': '#ccc',
                                'target-arrow-shape': 'triangle'
                            }
                        }
                    ],
                    layout: {
                        name: 'grid',
                        rows: 1
                    }
                });
                
                console.log('Cytoscape initialized successfully!');
                console.log('Nodes:', cy.nodes().length);
                console.log('Edges:', cy.edges().length);
                
            } catch (error) {
                console.error('Error creating Cytoscape:', error);
            }
        });
    </script>
</body>
</html>
