<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学理論生物体系図 - Mathematical Theory Organism</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            overflow: hidden;
        }
        
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(0, 0, 0, 0.8);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .header h1 {
            font-size: 24px;
            color: #00d4aa;
            text-shadow: 0 0 10px rgba(0, 212, 170, 0.5);
        }
        
        .controls {
            margin-left: auto;
            display: flex;
            gap: 10px;
        }
        
        .control-btn {
            padding: 8px 16px;
            background: rgba(0, 212, 170, 0.2);
            border: 1px solid #00d4aa;
            border-radius: 20px;
            color: #00d4aa;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .control-btn:hover {
            background: rgba(0, 212, 170, 0.4);
            box-shadow: 0 0 15px rgba(0, 212, 170, 0.3);
        }
        
        #cy {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, rgba(0, 20, 40, 0.8) 0%, rgba(0, 0, 0, 0.9) 100%);
        }
        
        .info-panel {
            position: fixed;
            right: 20px;
            top: 80px;
            width: 300px;
            max-height: 500px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(0, 212, 170, 0.3);
            border-radius: 10px;
            padding: 20px;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 999;
        }
        
        .info-panel.visible {
            opacity: 1;
            visibility: visible;
        }
        
        .info-panel h3 {
            color: #00d4aa;
            margin-bottom: 10px;
            text-shadow: 0 0 5px rgba(0, 212, 170, 0.5);
        }
        
        .info-panel p {
            font-size: 14px;
            line-height: 1.6;
            color: #ccc;
        }
        
        .legend {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(0, 212, 170, 0.3);
            border-radius: 10px;
            padding: 15px;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
        }
        
        .legend h4 {
            color: #00d4aa;
            margin-bottom: 10px;
            text-shadow: 0 0 5px rgba(0, 212, 170, 0.5);
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
            font-size: 12px;
        }
        
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            margin-right: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>数学理論生物体系図</h1>
        <div class="controls">
            <button class="control-btn" onclick="resetView()">リセット</button>
            <button class="control-btn" onclick="fitToView()">全体表示</button>
            <button class="control-btn" onclick="toggleLayout()">レイアウト変更</button>
        </div>
    </div>
    
    <div id="cy"></div>
    
    <div class="info-panel" id="infoPanel">
        <h3 id="infoTitle">選択してください</h3>
        <p id="infoDescription">ノードをクリックして詳細情報を表示</p>
    </div>
    
    <div class="legend">
        <h4>凡例</h4>
        <div class="legend-item">
            <div class="legend-color" style="background: #8B4513; box-shadow: 0 0 8px rgba(139, 69, 19, 0.6);"></div>
            <span>基礎論（根系）</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #228B22; box-shadow: 0 0 8px rgba(34, 139, 34, 0.6);"></div>
            <span>純粋数学（幹・枝）</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #FFD700; box-shadow: 0 0 8px rgba(255, 215, 0, 0.6);"></div>
            <span>応用数学（葉・花）</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #FF6347; box-shadow: 0 0 8px rgba(255, 99, 71, 0.6);"></div>
            <span>学際領域（果実）</span>
        </div>
    </div>

    <script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
    <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
    <script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
    <script src="https://unpkg.com/cytoscape-cose-bilkent@4.1.0/cytoscape-cose-bilkent.js"></script>
    <script src="app_complete.js"></script>
</body>
</html>
