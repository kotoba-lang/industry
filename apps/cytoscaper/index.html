<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学理論生物体系図 - 編集可能版</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            overflow: hidden;
        }
        
        .header {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
        }
        
        .title {
            font-size: 24px;
            font-weight: bold;
            color: #00d4aa;
            text-shadow: 0 0 10px rgba(0, 212, 170, 0.5);
        }
        
        .controls {
            margin-left: auto;
            display: flex;
            gap: 10px;
        }
        
        .control-btn {
            padding: 8px 16px;
            background: rgba(0, 212, 170, 0.2);
            border: 1px solid #00d4aa;
            border-radius: 20px;
            color: #00d4aa;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
        }
        
        .control-btn:hover {
            background: rgba(0, 212, 170, 0.4);
            box-shadow: 0 0 15px rgba(0, 212, 170, 0.3);
        }
        
        .control-btn.active {
            background: rgba(0, 212, 170, 0.6);
            box-shadow: 0 0 20px rgba(0, 212, 170, 0.5);
        }
        
        .edit-controls {
            display: flex;
            gap: 10px;
            margin-left: 20px;
        }
        
        .edit-btn {
            padding: 6px 12px;
            background: rgba(255, 193, 7, 0.2);
            border: 1px solid #ffc107;
            border-radius: 15px;
            color: #ffc107;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 12px;
        }
        
        .edit-btn:hover {
            background: rgba(255, 193, 7, 0.4);
        }
        
        .edit-btn.danger {
            background: rgba(220, 53, 69, 0.2);
            border-color: #dc3545;
            color: #dc3545;
        }
        
        .edit-btn.danger:hover {
            background: rgba(220, 53, 69, 0.4);
        }
        
        .container {
            display: flex;
            height: calc(100vh - 70px);
        }
        
        #cy {
            flex: 1;
            background: transparent;
        }
        
        .legend {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 15px;
            -webkit-backdrop-filter: blur(15px);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 200px;
        }
        
        .legend h3 {
            margin: 0 0 10px 0;
            color: #00d4aa;
            font-size: 16px;
            text-align: center;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin: 8px 0;
            font-size: 12px;
        }
        
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            margin-right: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .info-panel {
            position: fixed;
            top: 100px;
            right: -400px;
            width: 350px;
            height: calc(100vh - 120px);
            background: rgba(0, 0, 0, 0.9);
            border-radius: 15px 0 0 15px;
            padding: 20px;
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: right 0.3s ease;
            overflow-y: auto;
        }
        
        .info-panel.visible {
            right: 0;
        }
        
        .info-panel h3 {
            color: #00d4aa;
            margin-top: 0;
            border-bottom: 1px solid rgba(0, 212, 170, 0.3);
            padding-bottom: 10px;
        }
        
        .close-info {
            position: absolute;
            top: 15px;
            right: 15px;
            cursor: pointer;
            color: #999;
            font-size: 20px;
        }
        
        .close-info:hover {
            color: #fff;
        }
        
        /* モーダルダイアログ */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            -webkit-backdrop-filter: blur(5px);
            backdrop-filter: blur(5px);
        }
        
        .modal-content {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            margin: 5% auto;
            padding: 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 10px;
        }
        
        .modal-title {
            color: #00d4aa;
            font-size: 18px;
            font-weight: bold;
        }
        
        .close {
            color: #999;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .close:hover {
            color: #fff;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #00d4aa;
            font-weight: 500;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
            box-sizing: border-box;
        }
        
        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: #00d4aa;
            color: white;
        }
        
        .btn-primary:hover {
            background: #00b894;
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .file-controls {
            display: flex;
            gap: 10px;
            margin-left: 20px;
        }
        
        .file-btn {
            padding: 6px 12px;
            background: rgba(108, 117, 125, 0.2);
            border: 1px solid #6c757d;
            border-radius: 15px;
            color: #6c757d;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 12px;
        }
        
        .file-btn:hover {
            background: rgba(108, 117, 125, 0.4);
            color: white;
        }
        
        #fileInput {
            display: none;
        }
        
        .edit-mode-indicator {
            position: fixed;
            top: 80px;
            left: 20px;
            background: rgba(255, 193, 7, 0.9);
            color: #000;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            display: none;
            z-index: 100;
        }
        
        .edit-mode-indicator.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">数学理論生物体系図 - 編集可能版</div>
        <div class="controls">
            <div class="control-btn" onclick="resetView()">リセット</div>
            <div class="control-btn" onclick="fitToView()">全体表示</div>
            <div class="control-btn" onclick="toggleLayout()">レイアウト変更</div>
        </div>
        <div class="edit-controls">
            <div class="edit-btn" id="editModeBtn" onclick="toggleEditMode()">編集モード</div>
            <div class="edit-btn" onclick="addNode()">ノード追加</div>
            <div class="edit-btn" onclick="addEdge()">エッジ追加</div>
            <div class="edit-btn danger" onclick="deleteSelected()">削除</div>
        </div>
        <div class="file-controls">
            <div class="file-btn" onclick="exportData()">エクスポート</div>
            <div class="file-btn" onclick="document.getElementById('fileInput').click()">インポート</div>
            <div class="file-btn" onclick="saveToLocal()">保存</div>
            <div class="file-btn" onclick="loadFromLocal()">読み込み</div>
        </div>
    </div>
    
    <div class="edit-mode-indicator" id="editModeIndicator">
        📝 編集モード: ノードをダブルクリックで編集、右クリックで削除
    </div>
    
    <input type="file" id="fileInput" accept=".json" onchange="importData(event)">
    
    <div class="container">
        <div id="cy"></div>
    </div>
    
    <div class="legend">
        <h3>凡例</h3>
        <div class="legend-item">
            <div class="legend-color" style="background: #654321;"></div>
            <span>基礎論（根系）</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #2E7D32;"></div>
            <span>純粋数学（幹・枝）</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #F57F17;"></div>
            <span>応用数学（葉・花）</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #D32F2F;"></div>
            <span>学際領域（果実）</span>
        </div>
    </div>
    
    <div class="info-panel" id="infoPanel">
        <div class="close-info" onclick="closeInfo()">×</div>
        <h3 id="infoTitle">情報パネル</h3>
        <p id="infoDescription">ノードをクリックして詳細情報を表示</p>
        <div id="infoDetails"></div>
    </div>
    
    <!-- ノード編集モーダル -->
    <div id="nodeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">ノード編集</h3>
                <span class="close" onclick="closeNodeModal()">&times;</span>
            </div>
            <form id="nodeForm">
                <div class="form-group">
                    <label for="nodeId">ID:</label>
                    <input type="text" id="nodeId" name="id" required>
                </div>
                <div class="form-group">
                    <label for="nodeLabel">ラベル:</label>
                    <input type="text" id="nodeLabel" name="label" required>
                </div>
                <div class="form-group">
                    <label for="nodeType">タイプ:</label>
                    <select id="nodeType" name="type">
                        <option value="foundation_root">基礎論（根系）</option>
                        <option value="foundation">基礎論</option>
                        <option value="trunk">主幹</option>
                        <option value="branch_algebra">代数枝</option>
                        <option value="branch_geometry">幾何枝</option>
                        <option value="branch_analysis">解析枝</option>
                        <option value="branch_number">数論枝</option>
                        <option value="branch_discrete">離散枝</option>
                        <option value="sub_branch">サブ枝</option>
                        <option value="leaf_cluster">葉群</option>
                        <option value="leaf">葉</option>
                        <option value="fruit_cluster">果実群</option>
                        <option value="fruit">果実</option>
                        <option value="seed">種</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="nodeCategory">カテゴリ:</label>
                    <select id="nodeCategory" name="category">
                        <option value="基礎論">基礎論</option>
                        <option value="純粋数学">純粋数学</option>
                        <option value="応用数学">応用数学</option>
                        <option value="学際領域">学際領域</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="nodeLevel">レベル:</label>
                    <input type="number" id="nodeLevel" name="level" min="0" max="10" value="0">
                </div>
                <div class="form-group">
                    <label for="nodeDescription">説明:</label>
                    <textarea id="nodeDescription" name="description" placeholder="ノードの説明を入力してください"></textarea>
                </div>
                <div class="form-group">
                    <label for="nodeDetails">詳細:</label>
                    <textarea id="nodeDetails" name="details" placeholder="詳細情報を入力してください"></textarea>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn btn-secondary" onclick="closeNodeModal()">キャンセル</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- エッジ編集モーダル -->
    <div id="edgeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">エッジ編集</h3>
                <span class="close" onclick="closeEdgeModal()">&times;</span>
            </div>
            <form id="edgeForm">
                <div class="form-group">
                    <label for="edgeSource">開始ノード:</label>
                    <select id="edgeSource" name="source" required>
                        <!-- 動的に生成 -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="edgeTarget">終了ノード:</label>
                    <select id="edgeTarget" name="target" required>
                        <!-- 動的に生成 -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="edgeType">タイプ:</label>
                    <select id="edgeType" name="type">
                        <option value="nutrient_flow">栄養供給</option>
                        <option value="foundation_to_pure">基礎→純粋</option>
                        <option value="growth_flow">成長フロー</option>
                        <option value="sub_branch_growth">サブ枝成長</option>
                        <option value="cross_pollination">交差受粉</option>
                        <option value="application_flow">応用フロー</option>
                        <option value="specialization">特化</option>
                        <option value="synthesis_flow">統合フロー</option>
                        <option value="fruition">結実</option>
                        <option value="seed_formation">種形成</option>
                        <option value="direct_application">直接応用</option>
                        <option value="deep_root_support">深層サポート</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="edgeLabel">ラベル:</label>
                    <input type="text" id="edgeLabel" name="label" placeholder="エッジのラベルを入力してください">
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn btn-secondary" onclick="closeEdgeModal()">キャンセル</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
    <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
    <script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
    <script src="https://unpkg.com/cytoscape-cose-bilkent@4.1.0/cytoscape-cose-bilkent.js"></script>
    <script src="app_editable.js"></script>
</body>
</html>
