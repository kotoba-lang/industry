<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" width="460" height="460" role="img" aria-labelledby="etzhayyim-mark-title">
  <title id="etzhayyim-mark-title">etzhayyim mark — torii, fish, open book, YHWH root, dharma wheel, Tree of Life leaves</title>
  <g fill="#0b0d10">
    <!-- torii (Shinto covering) -->
    <g id="torii">
      <rect x="48" y="54" width="364" height="17" rx="3"/>
      <polygon points="48,54 30,42 48,42"/>
      <polygon points="412,54 430,42 412,42"/>
      <rect x="92" y="80" width="276" height="12" rx="2"/>
      <rect x="112" y="80" width="21" height="94" rx="2"/>
      <rect x="327" y="80" width="21" height="94" rx="2"/>
    </g>

    <!-- ichthys fish (Christ) -->
    <g id="fish">
      <path d="M 150 210
               C 168 190 200 178 228 178
               C 256 178 288 190 306 210
               C 288 230 256 242 228 242
               C 200 242 168 230 150 210 Z
               M 306 210 L 330 196 L 322 210 L 330 224 Z"/>
    </g>

    <!-- open book (Old + New Testament study) -->
    <g id="book">
      <path d="M 228 254 L 150 268 L 150 300 L 228 288 Z"/>
      <path d="M 228 254 L 306 268 L 306 300 L 228 288 Z"/>
      <rect x="225" y="254" width="6" height="34"/>
    </g>

    <!-- Hebrew היה — root of YHWH / "in the beginning was the kotoba" -->
    <text x="230" y="342" text-anchor="middle" font-family="ui-serif, 'Times New Roman', serif" font-size="40" letter-spacing="1">היה</text>

    <!-- dharma wheel (Buddhism, the base) -->
    <g id="dharma-wheel">
      <circle cx="230" cy="400" r="34" fill="none" stroke="#0b0d10" stroke-width="9"/>
      <circle cx="230" cy="400" r="7"/>
      <g stroke="#0b0d10" stroke-width="6">
        <line x1="230" y1="368" x2="230" y2="432"/>
        <line x1="198" y1="400" x2="262" y2="400"/>
        <line x1="207" y1="377" x2="253" y2="423"/>
        <line x1="207" y1="423" x2="253" y2="377"/>
      </g>
    </g>

    <!-- Tree of Life leaves flanking the wheel -->
    <g id="leaves">
      <path d="M 176 402 C 150 392 128 402 112 424 C 138 428 162 422 176 402 Z"/>
      <path d="M 284 402 C 310 392 332 402 348 424 C 322 428 298 422 284 402 Z"/>
    </g>
  </g>
</svg>
