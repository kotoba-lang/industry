name: kotoba migration parity

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  parity:
    name: kotoba migration parity
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Clojure and nbb
        uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest

      - name: Setup Node + nbb
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Setup python + west
        run: |
          python -m pip install --upgrade pip
          pip install west

      - name: west.yml canonical (--check)
        run: npx nbb scripts/gen-west-manifest.cljs --check

      - name: west init + update
        run: |
          west init -l manifest
          west update --fetch smart

      - name: kotoba boundary audit
        run: npx nbb scripts/kotoba-boundary-audit.cljs

      - name: CLJ/CLJC migration gates
        run: npx nbb scripts/verify-clj-everywhere.cljs
