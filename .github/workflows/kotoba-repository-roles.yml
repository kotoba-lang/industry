name: kotoba repository roles

# The check verifies declarations that live in CHILD repositories, so tying it
# only to changes in this repo meant it never fired: between 2026-07-26 and
# 2026-07-29 it ran twice (both failing) and in the meantime five child repos
# drifted — production dependencies were added without updating :depends-on,
# and nothing reported it. The schedule is what makes the check real.
# ADR-2607299000.

on:
  pull_request:
    paths:
      - 'scripts/verify-repository-roles.cljs'
      - 'manifest/repository-rules.edn'
      - '.github/workflows/kotoba-repository-roles.yml'
      - '90-docs/adr/2607266000-kotoba-stack-responsibility-split-t0-t3.edn'
      - '90-docs/adr/2607299000-repository-rules-workspace-authority.edn'
  push:
    branches: [main]
    paths:
      - 'scripts/verify-repository-roles.cljs'
      - 'manifest/repository-rules.edn'
      - '.github/workflows/kotoba-repository-roles.yml'
  schedule:
    # Weekly, so child-repo drift is caught without a superproject change.
    - cron: '17 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: root
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: root/package-lock.json
      - run: npm ci
        working-directory: root

      # Runs the SAME gate script the murakumo fleet runs, which in turn calls
      # the same verifier. Two implementations of one invariant would let a
      # check pass on one path and fail on the other without anyone noticing.
      #
      # It reads its target list from manifest/repository-rules.edn
      # :checked-repos and fetches the two files per repo from raw
      # (all public, no token), so this job no longer clones 21 repositories
      # and no longer carries a second copy of the list.
      - name: Verify declarations, real dependencies, direction, and cycles
        run: npx nbb scripts/fleet-ci/gates/repository-roles-check.cljs . --min 20
        working-directory: root

      # Laid out as orgs/<org>/<repo> so --prefix-audit can resolve the west
      # manifest paths and tell "no declaration" apart from "checkout absent".
      - name: Check out name-prefix repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ws/orgs/kotoba-lang
          for repo in loop-ux-kaizen loop-system-dynamics loop-innen loop-lei-catalog \
                      skill-loop-system-dynamics action-loop-system-dynamics; do
            gh repo clone "kotoba-lang/$repo" "ws/orgs/kotoba-lang/$repo"
          done

      # Reports which prefix-carrying repos declare a contract and which do not.
      # Known gaps are recorded in manifest/repository-rules.edn :gaps, so this
      # surfaces drift from that record rather than re-failing on known gaps.
      - name: Audit name-prefix coverage
        run: npx nbb scripts/verify-repository-roles.cljs --prefix-audit --workspace ../ws
        working-directory: root
