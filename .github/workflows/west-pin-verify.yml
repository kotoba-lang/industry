# west.yml の pin 変更をサーバ側検証する(ADR-2607022900)。
# - PR: base との diff で変わった pin を検証(存在 / default branch 到達性 / 前進)。
# - push to main: 同検証。API single-entry commit は pre-merge で止められないため、
#   壊れた pin が main に入ったら即検知して issue を起こす(数時間放置 → 数分に短縮)。
# 注意: github.token では private org(gftdcojp / com-junkawasaki)の子リポが見えず、
# その entry は WARN(素通し)になる。厳密化するには org read 権限の PAT を
# WEST_PIN_VERIFY_TOKEN secret に設定する。
name: west-pin-verify

on:
  pull_request:
    paths: [manifest/west.yml]
  push:
    branches: [main]
    paths: [manifest/west.yml]

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install babashka
        run: |
          curl -sLO https://raw.githubusercontent.com/babashka/babashka/master/install
          chmod +x install && sudo ./install

      - name: Fetch baseline west.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "no usable baseline (new branch?) — comparing against main"
            BASE_SHA="main"
          fi
          gh api "repos/${{ github.repository }}/contents/manifest/west.yml?ref=$BASE_SHA" \
            -H 'Accept: application/vnd.github.raw' > /tmp/west-baseline.yml
          echo "baseline: $BASE_SHA ($(wc -l < /tmp/west-baseline.yml) lines)"

      - name: Verify changed pins (server-side)
        env:
          GH_TOKEN: ${{ secrets.WEST_PIN_VERIFY_TOKEN != '' && secrets.WEST_PIN_VERIFY_TOKEN || github.token }}
        run: |
          bb scripts/verify-west-pins.bb \
            --baseline /tmp/west-baseline.yml \
            --candidate manifest/west.yml

      - name: Open issue on main breakage
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MARKER="west.yml pin verification failed on main"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$MARKER\" in:title" --json number --jq 'length')
          if [ "$EXISTING" = "0" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$MARKER (${GITHUB_SHA:0:12})" \
              --body "$(printf 'Commit %s introduced west.yml pins that fail server-side verification (missing upstream / not reachable from default branch / regression).\n\nRun locally:\n\n    bb scripts/verify-west-pins.bb --baseline <prev-commit> --candidate manifest/west.yml\n\nSee the failed run: %s/%s/actions/runs/%s\n\nPolicy: CLAUDE.md "Git operations" / manifest/repos.edn :manifest-workflow :pin-verification (ADR-2607022900).' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          else
            echo "open issue already exists — not duplicating"
          fi
