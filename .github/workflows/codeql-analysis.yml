name: "CodeQL Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 6 * * 1'  # 月曜日午前6時（UTC）に実行

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript', 'python', 'go', 'rust' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        config-file: ./.github/codeql-config.yml

    - name: Setup pnpm (for JavaScript/TypeScript)
      if: matrix.language == 'javascript'
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Setup Node.js (for JavaScript/TypeScript)
      if: matrix.language == 'javascript'
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'
        cache-dependency-path: |
          pnpm-lock.yaml
          apps/*/pnpm-lock.yaml

    - name: Setup Python (for Python)
      if: matrix.language == 'python'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup Go (for Go)
      if: matrix.language == 'go'
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Setup Rust (for Rust)
      if: matrix.language == 'rust'
      uses: dtolnay/rust-toolchain@stable

    - name: Install Python dependencies
      if: matrix.language == 'python'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt || true
        find . -name "requirements.txt" -exec pip install -r {} \; || true
        find . -name "pyproject.toml" -exec pip install -e . \; || true

    - name: Install Node.js dependencies
      if: matrix.language == 'javascript'
      run: |
        pnpm install --frozen-lockfile || npm ci || true

    - name: Install Go dependencies
      if: matrix.language == 'go'
      run: |
        find . -name "go.mod" -execdir go mod download \; || true

    - name: Install Rust dependencies
      if: matrix.language == 'rust'
      run: |
        find . -name "Cargo.toml" -execdir cargo fetch \; || true

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
        upload: never
