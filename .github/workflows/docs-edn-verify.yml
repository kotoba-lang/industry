# 90-docs の EDN 正本を検証する(ADR-2607171600 / 2607181900)。
# - adr-ledger --verify: :event/seq の一意性・単調性と、event が指す adr/id が
#   実在する ADR に解決できるか。
# - docs-edn-only verify: 90-docs 配下が EDN only 方針に従っているか。
#
# なぜ今さら追加するのか: この 2 つの検証器は既に書かれていたのに、13 本ある
# workflow のどれからも呼ばれていなかった(2026-07-25 実測)。結果として
# adr-ledger は FAIL したまま放置され、その中に「duplicate key で parse できず
# 全 query から不可視になっていた ADR」(2607022610)が埋もれていた。書いてある
# だけの検証器は無いのと同じなので、cron と PR の両方に配線する。
#
# schedule を入れる理由は foundation-deps-verify.yml / repo-reality-verify.yml と
# 同じ: この repo への push では発火しない静かな腐敗(他 agent が ledger に append
# した先の ADR を作り忘れた等)を掃くため。既存 cron(01:17 / 04:30 / 06:00Mon /
# 06:17 / 07:43 / */15)を避けて 02:41 UTC に置く。
name: docs-edn-verify

on:
  pull_request:
    paths:
      - '90-docs/**'
      - 'scripts/adr-ledger-append.cljs'
      - 'manifest/docs-edn-only.cljs'
  push:
    branches: [main]
    paths:
      - '90-docs/**'
      - 'scripts/adr-ledger-append.cljs'
      - 'manifest/docs-edn-only.cljs'
  schedule:
    - cron: "41 2 * * *"   # 毎日 02:41 UTC (11:41 JST)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 2 つは独立の欠陥を見るので、前者が落ちても後者を必ず動かす
      # (片方の失敗でもう片方の状態が見えなくなるのを避ける)。
      - name: adr-ledger verify
        id: ledger
        continue-on-error: true
        run: nbb --classpath ".:scripts/nbb_compat" scripts/adr-ledger-append.cljs --verify

      - name: docs-edn-only verify
        id: docs
        continue-on-error: true
        run: nbb --classpath ".:scripts/nbb_compat" manifest/docs-edn-only.cljs verify

      - name: Summarise
        run: |
          {
            echo "### docs-edn-verify"
            echo ""
            echo "| check | result |"
            echo "|---|---|"
            echo "| adr-ledger --verify | ${{ steps.ledger.outcome }} |"
            echo "| docs-edn-only verify | ${{ steps.docs.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any check failed
        if: steps.ledger.outcome == 'failure' || steps.docs.outcome == 'failure'
        run: |
          echo "::error::docs-edn verification failed — see the step logs above."
          exit 1
