# doc-vs-code drift check for the 5 kotoba-lang core projects (kotoba, kotoba-lang, kotobase,
# aiueos, kototama) — 90-docs/repo-reality/ (design discussed 2026-07-15, methods 1/4/5:
# executable claims + claim-to-evidence linkage + append-only drift ledger).
# - schedule: catches drift that no push to THIS repo would trigger (e.g. a kotoba-lang/aiueos
#   README loses its own disclosed-gap caveat, or a cited test/fixture file quietly disappears
#   upstream) — same rationale as foundation-deps-verify.yml.
# - push to main: sanity-check whenever the claim schema/verify scripts themselves change.
# - workflow_dispatch: manual.
# Regression policy: a claim scoring low (e.g. aiueos's known device-access-stub gap at 0.2) is
# NOT a failure by itself — many claims here intentionally score low because they cite a real,
# disclosed, still-open gap. ci_gate.cljs only fails the job when a claim's score DROPS versus
# its last recorded ledger entry — that is the actual "something changed for the worse" signal.
# The orgs/<repo> checkouts are NOT this repo's git history (west-managed, not submodules) — CI
# shallow-clones them directly from the public kotoba-lang GitHub org each run.
name: repo-reality-verify

on:
  schedule:
    - cron: "43 7 * * *"   # 毎日 07:43 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [90-docs/repo-reality/**, .github/workflows/repo-reality-verify.yml]

permissions:
  contents: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nbb + datascript
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Shallow-clone the 5 kotoba-lang projects under verification
        run: |
          for repo in kotoba kotoba-lang kotobase aiueos kototama; do
            git clone --depth 1 "https://github.com/kotoba-lang/$repo.git" "orgs/kotoba-lang/$repo"
          done

      - name: Run repo-reality CI gate (verify claims, append ledger, fail on regression)
        id: gate
        run: npx nbb 90-docs/repo-reality/ci_gate.cljs

      - name: Commit ledger append (even on regression — the run IS the record)
        if: always()
        run: |
          if git diff --quiet -- 90-docs/repo-reality/repo-reality-ledger.edn; then
            echo "no ledger changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 90-docs/repo-reality/repo-reality-ledger.edn
          git commit -m "repo-reality: verify run $(date -u +%Y-%m-%dT%H:%M:%SZ)

Automated append from .github/workflows/repo-reality-verify.yml (run ${{ github.run_id }})."
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && break
            echo "push attempt $attempt failed, retrying after fetch+rebase..."
            sleep 5
          done

      - name: Open issue on regression
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MARKER="repo-reality drift regression detected"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$MARKER\" in:title" --json number --jq 'length')
          if [ "$EXISTING" = "0" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$MARKER ($(date -u +%Y-%m-%d))" \
              --body "$(printf 'A claim in 90-docs/repo-reality/ scored LOWER than its last recorded ledger entry — something got worse (a disclosed gap regressed further, a cited caveat was silently removed while the underlying issue remains, or cited evidence disappeared).\n\nSee the run log for which claim(s) regressed and why: %s/%s/actions/runs/%s\n\nRe-run locally:\n\n    npm ci\n    for repo in kotoba kotoba-lang kotobase aiueos kototama; do git clone --depth 1 https://github.com/kotoba-lang/$repo.git orgs/kotoba-lang/$repo; done\n    nbb 90-docs/repo-reality/ci_gate.cljs\n\nPolicy: doc-vs-code drift verification discussed 2026-07-15, methods 1 (executable claims) + 4 (claim-to-evidence linkage) + 5 (append-only ledger).' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          else
            echo "open issue already exists — not duplicating"
          fi
