# annex 化した実体が「このマシン以外にも本当に在る」ことを定期的に証明する
# (ADR-2607252000)。
#
# なぜ必要か: SHIRO & PICO ep01 のパネルとモーションコミックは、ASSETS-DATALAD.md が
# 数週間「DataLad dataset に退避済み」と主張し続けた末に失われた。dataset の
# ディレクトリは存在せず、IPFS pin は GC 済み(公開ゲートウェイ 4 つとも 504)、
# 記載の B2 バケットはどの現存鍵からも到達できなかった。誰も一度も復元を試さな
# かったので、必要になるまで欠落が見えなかった。
#
# したがってこの workflow が見るのは「バックアップを取ったか」ではなく
# 「バックアップが今読めるか」:
#   1. whereis — annex 済み各ファイルが here 以外に 1 つ以上コピーを持つか
#   2. fsck --from <remote> — 標本を remote から実際に落として checksum 照合
# fsck は非破壊(local コピーを消さない)なので、remote が壊れていても最後の実体を
# 失う危険が無い。
#
# 必要な secrets:
#   B2_KEY_ID / B2_APP_KEY / B2_BUCKET — annex S3 remote 用(未設定ならスキップ)
#   FLEET_READ_TOKEN                   — private org の子リポ clone 用 org read PAT
# どちらも無い環境では job は「検証不能」として明示的に落ちる。custody を証明で
# きない状態を green と report するのは、まさに ep01 を失った失敗様式なので。
#
# 既存 cron(01:17 / 02:41 / 04:30 / 06:00Mon / 06:17 / 07:43 / */15)を避けて
# 03:23 UTC。
name: annex-custody-verify

on:
  schedule:
    - cron: "23 3 * * *"   # 毎日 03:23 UTC (12:23 JST)
  workflow_dispatch:
    inputs:
      names:
        description: "対象 project 名(カンマ区切り、空なら全て)"
        required: false
        default: ""
      sample:
        description: "repo あたり fsck する標本数"
        required: false
        default: "1"

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install git-annex
        run: sudo apt-get update && sudo apt-get install -y git-annex

      - name: Require credentials
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          FLEET_READ_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}
        run: |
          missing=""
          [ -z "$B2_KEY_ID" ] && missing="$missing B2_KEY_ID"
          [ -z "$FLEET_READ_TOKEN" ] && missing="$missing FLEET_READ_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::missing secrets:$missing — custody を証明できないため fail します"
            exit 1
          fi

      # 実体(content)は落とさない。annex pointer と location tracking を運ぶ
      # git-annex ブランチさえあれば whereis は判定でき、fsck は必要な標本だけを
      # remote から取得する。
      - name: Clone DataLad projects (git only, no annex content)
        env:
          GH_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}
        run: |
          set -euo pipefail
          nbb --classpath ".:scripts/nbb_compat" scripts/annex-custody-verify.cljs \
            --list-projects > /tmp/datalad-projects.txt
          cat /tmp/datalad-projects.txt
          while read -r name path; do
            [ -z "$name" ] && continue
            org=$(echo "$path" | cut -d/ -f2)
            repo=$(basename "$path")
            mkdir -p "$(dirname "$path")"
            git clone --no-checkout \
              "https://x-access-token:${GH_TOKEN}@github.com/${org}/${repo}.git" "$path" \
              || { echo "::warning::clone failed: $org/$repo (skipped)"; continue; }
            git -C "$path" checkout || true
          done < /tmp/datalad-projects.txt

      - name: Verify custody
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}
        run: |
          nbb --classpath ".:scripts/nbb_compat" scripts/annex-custody-verify.cljs \
            --names "${{ github.event.inputs.names }}" \
            --sample "${{ github.event.inputs.sample || '1' }}" \
            --report /tmp/custody-report.edn 2>&1 | tee /tmp/custody.log

      - name: Summarise
        if: always()
        run: |
          {
            echo "### annex-custody-verify"
            echo ""
            echo '```'
            head -60 /tmp/custody.log 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
