name: Build and Deploy JupyterLite Physics Research

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/research/physics_restructured/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/research/physics_restructured/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install jupyterlite-core
        pip install jupyterlite
        pip install jupyterlite-pyodide-kernel

    - name: Build JupyterLite site
      run: |
        cd apps/research/physics_restructured
        jupyter lite build --contents notebooks --output-dir _output

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: apps/research/physics_restructured/_output

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 