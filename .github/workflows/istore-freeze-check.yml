name: IStore Freeze Check

on:
  pull_request:
    paths:
      - 'orgs/kotoba-lang/**/*.clj'
      - 'orgs/kotoba-lang/**/*.cljs'
      - 'orgs/kotoba-lang/**/*.cljc'
      - 'orgs/gftdcojp/**/*.clj'
      - 'orgs/gftdcojp/**/*.cljs'
      - 'orgs/gftdcojp/**/*.cljc'

jobs:
  istore-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR base and head commits
        id: commits
        run: |
          echo "base=${{ github.event.pull_request.base.sha }}" >> $GITHUB_OUTPUT
          echo "head=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT

      - name: Check for NEW IStore usage (not in base)
        run: |
          # Get list of added/modified files in this PR
          git diff --name-only ${{ steps.commits.outputs.base }}..HEAD > changed_files.txt

          # Pattern to match IStore-related namespaces and calls
          # Match: kotobase.store.IStore, IStore, kotobase.store.*, etc.
          # but allow existing usage (only flag NEW additions)
          ISTORE_PATTERN='(kotobase\.store\.IStore|kotobase\.store\.ITransactionalStore|kotobase\.store\.LocalStore|kotobase\.store\.KotobaseStore|kotobase\.store\.[a-z-]+/[a-z-]+)'

          ERROR_COUNT=0

          while IFS= read -r file; do
            # Only check changed Clojure files
            if [[ ! "$file" =~ \.(clj|cljs|cljc)$ ]]; then
              continue
            fi

            # Get only NEW lines (additions) in this PR
            NEW_ISTORE_LINES=$(git diff ${{ steps.commits.outputs.base }}..HEAD -- "$file" | \
              grep '^+' | grep -v '^+++' | \
              grep -iE "$ISTORE_PATTERN" | \
              wc -l)

            if [ "$NEW_ISTORE_LINES" -gt 0 ]; then
              echo "❌ ERROR: Found $NEW_ISTORE_LINES NEW lines using IStore in $file"
              git diff ${{ steps.commits.outputs.base }}..HEAD -- "$file" | \
                grep '^+' | grep -v '^+++' | \
                grep -iE "$ISTORE_PATTERN" | \
                head -5
              ERROR_COUNT=$((ERROR_COUNT + NEW_ISTORE_LINES))
            fi
          done < changed_files.txt

          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo ""
            echo "❌ ADR-2607201600 M0 Freeze: NEW IStore usage is not permitted"
            echo "   This ADR retires the IStore abstraction (kotobase.store.* APIs)"
            echo "   Existing IStore code will be migrated incrementally (M1-M6)"
            echo "   New code must use datom transaction/query/pull APIs instead"
            echo ""
            echo "   Rejected patterns:"
            echo "     - kotobase.store.IStore"
            echo "     - kotobase.store.ITransactionalStore"
            echo "     - kotobase.store.LocalStore"
            echo "     - kotobase.store.KotobaseStore"
            echo "     - kotobase.store.*/put, kotobase.store.*/get, etc."
            echo ""
            exit 1
          else
            echo "✓ IStore freeze check passed: no new IStore usage detected"
          fi
