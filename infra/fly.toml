# fly.toml app configuration file generated for gitea on 2024-01-01T00:00:00Z
app = "my-gitea"
primary_region = "nrt"

[build]

[deploy]
  strategy = "rolling"

[env]
  USER_UID = "1000"
  USER_GID = "1000"
  GITEA__database__DB_TYPE = "postgres"
  GITEA__database__HOST = "my-gitea-db.internal:5432"
  GITEA__database__NAME = "gitea"
  GITEA__database__USER = "gitea"
  GITEA__server__DOMAIN = "my-gitea.fly.dev"
  GITEA__server__SSH_DOMAIN = "my-gitea.fly.dev"
  GITEA__server__ROOT_URL = "https://my-gitea.fly.dev/"
  GITEA__storage__SERVE_DIRECT = "true"
  GITEA__storage__STORAGE_TYPE = "minio"
  GITEA__log__LEVEL = "Info"
  GITEA__security__INSTALL_LOCK = "true"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[services]]
  protocol = "tcp"
  internal_port = 22
  ports = [
    { port = 22, handlers = ["tls"] }
  ]

[mounts]
  source = "gitea_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024 