# fly.toml app configuration file generated for gitea on 2024-01-01T00:00:00Z
app = "git-emergent-gftd-co-jp"
primary_region = "nrt"

[build]
  image = "gitea/gitea:1.21.3"

[deploy]
  strategy = "rolling"

[env]
  USER_UID = "1000"
  USER_GID = "1000"
  GITEA__database__DB_TYPE = "postgres"
  GITEA__database__HOST = "git-emergent-gftd-co-jp-db.internal:5432"
  GITEA__database__NAME = "gitea"
  GITEA__database__USER = "gitea"
  GITEA__database__SSL_MODE = "disable"
  GITEA__server__DOMAIN = "git-emergent-gftd-co-jp.fly.dev"
  GITEA__server__SSH_DOMAIN = "git-emergent-gftd-co-jp.fly.dev"
  GITEA__server__ROOT_URL = "https://git-emergent-gftd-co-jp.fly.dev/"
  GITEA__server__SSH_PORT = "22"
  GITEA__server__HTTP_PORT = "3000"
  GITEA__server__HTTP_ADDR = "0.0.0.0"
  GITEA__storage__SERVE_DIRECT = "true"
  GITEA__storage__STORAGE_TYPE = "minio"
  GITEA__log__LEVEL = "Info"
  GITEA__security__INSTALL_LOCK = "true"
  GITEA__security__ADMIN_USER_NAME = "admin"
  GITEA__security__ADMIN_EMAIL = "admin@example.com"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[services]]
  protocol = "tcp"
  internal_port = 22
  ports = [
    { port = 22, handlers = ["tls"] }
  ]

[mounts]
  source = "gitea_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024 