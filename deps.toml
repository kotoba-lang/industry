# ─── Personal data warehouse ───────────────────────────────────────
#
# Sensor-ingestion + encrypted storage layer for the top-level orchestrator
# (ADR-0001). Implements the "Sensors (read-only)" input as a reproducible,
# version-controlled, encrypted dataset. See ADR-0003.

[personal]
path = "personal"
kind = "personal-data-warehouse"
description = "Encrypted personal data warehouse: Mac + Android terminals, Gmail/Calendar/Drive/GitHub/1Password, SMS/calls, finance/tax/legal/property/medical, plus derived analysis. DataLad dataset; data is git-annexed (pointers only in git) and gpg-hybrid encrypted; only ciphertext is pinned to IPFS."
adrs = [
  "kawasakijun/docs/adr/0003-personal-data-warehouse-encrypted-ipfs.md",
  "kawasakijun/docs/adr/0004-account-scope-and-file-body-capture.md",
  "kawasakijun/docs/adr/0005-legal-evidence-preservation.md",
]
stack = ["DataLad", "git-annex", "gpg", "IPFS", "adb", "Datomic Local (Clojure)"]
sources = ["device-mac", "device-android (getprop/packages/SMS-bodies/calls/contacts)", "gmail", "google-calendar", "google-drive", "github", "1password (metadata-only inventory)"]
capture = ["metadata", "file-bodies"]   # ADR-0004: annexed binaries (drive/files/{tax,loans,contracts-corp})
analysis_artifacts = ["analysis/INDEX.md", "analysis/catalog.json", "analysis/observations.md", "analysis/financial-summary.json", "analysis/loan-ledger.json", "analysis/subscription-audit.json", "analysis/entities.json", "analysis/action-register.json", "analysis/sms-finance-timeline.jsonl", "analysis/datomic-report.md"]
file_count = 133   # annexed + pinned to IPFS (encrypted); as of 2026-05-31
secrets_policy = "env var NAMES only; GitHub token VALUE not stored; 1Password = metadata only (no passwords/TOTP); SMS OTP/2FA codes redacted in derived files; data never plaintext to GitHub"
litigation_state = "kawasakijun/litigation_state.jsonld"
evidence_policy = "係争関連アカウントは削除せず保全 (ADR-0005); 正本=admin Data Export(mbox); 副本=warehouse; 改ざん封緘=SHA-256 + OpenTimestamps + git-annex"

# Google account scope & reachability (ADR-0004).
# The MCP Google connector is bound to a SINGLE OAuth session (jun784); it cannot
# switch accounts. Other accounts need their own MCP connector, Takeout, or browser login.
[[personal.account]]
id = "jun784@gmail.com"
role = "primary"
reach = "mcp"          # Gmail/Calendar/Drive connector (+ Chrome /u/0)
status = "ingested"    # full Drive inventory + 47 file-bodies + finance/calendar
[[personal.account]]
id = "root@jk.luxury"
role = "corp (jk.luxury / LingLing litigation, LATOKEN, virtual office)"
reach = "browser"      # Chrome /u/1 only; NOT on MCP
status = "pending"     # needs MCP connector or Takeout for warehouse-scale ingest
[[personal.account]]
id = "root@junkawasaki.com"
reach = "none"         # not logged into Chrome, not on MCP
status = "unreachable"
[[personal.account]]
id = "jun@gftd.group"
reach = "none"
status = "unreachable"

# Normalized query layer (rebuildable derived index; JSONL remains source of truth).
[personal.datomic]
impl = "personal/bin/datomic (deps.edn + src/warehouse/load.clj)"
engine = "com.datomic/local 1.0.291 (datomic:local, :storage-dir :mem, no transactor)"
rebuild = "cd personal/bin/datomic && clojure -M -m warehouse.load"
schema = "EAV refs: org / person / account / txn / loan / event / action"
loaded = { org = 110, person = 29, txn = 631, loan = 19, event = 49, action = 23 }
known_issues = ["txn double-count across 8 finance files (need dedup-key=date+vendor+amount)", "loan-ledger total ¥10.75M vs agreement detail sum ¥7.89M mismatch (recompute from detail)"]

# jk.luxury Drive archive — litigation evidence (ADR-0007 Phase 3).
# 41G を personal/drive/jk-luxury-archive/ に取り込み、全ファイル annex(MD5E)→B2。
# GitHub にはポインタのみ（平文は載せない）。元の単独 clone は B2 検証後に削除。
[personal.drive.jk_luxury_archive]
path = "personal/drive/jk-luxury-archive"
size = "41G (annex dedup 後の unique ~33G)"
file_count = 26135   # annexed(26121) + git(14); .DS_Store(17) のみ除外
contents = "OUCHI訴状準備, SQL dumps, Telegram exports, KYC docs, Commons_JK records 等"
copies = "local git-annex + backblaze-b2 (encryption=hybrid)"
verified = "git annex fsck --from b2 OK (証拠PDF含む); 全28327キー B2 在"
source_clone = "deleted 2026-06-09 after B2 verification (no remote = was sole copy)"
note = "ignore された archive 内 nested .gitignore 由来 484 ファイルも --no-check-gitignore で強制保全"

[personal.storage]
vcs = "datalad"
content = "git-annex (annex-ignore on origin)"
remote_primary = "backblaze-b2 (git-annex type=S3, encryption=hybrid)"   # ADR-0007
remote_secondary = "ipfs (external special remote, encryption=hybrid)"
b2_account = "gftdcojp"
b2_endpoint = "s3.us-west-004.backblazeb2.com"   # region us-west-004
b2_bucket = "com-junkawasaki-annex"              # allPrivate, dedicated (id 8d596f46ac50ab9a91e20518)
b2_annex_uuid = "e5715721-d944-42ec-8458-3d8b18bc501b"
b2_key_custody = "1Password gftdcojp vault: 'com-junkawasaki.b2/annex' (scoped key 004d9f6c0ba12580000000008); creds embedded gpg-encrypted in git-annex branch"

[personal.encryption]
cipher = "gpg encryption=hybrid"
keyid = "09EE841334482F5A0F5C4958A70BB2C220DE88CA"
passphrase_custody = "macOS Keychain (gpg:personal-data)"
recovery = "1Password Private vault: 'GPG: personal-data warehouse recovery (jun784)' (armored secret key + passphrase)"

