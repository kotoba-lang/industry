# com-junkawasaki — deps.toml
#
# Machine-readable SSoT for the com-junkawasaki workspace.
# Repos are organized under orgs/<org>/<repo> (ADR-0007). Large file content is
# persisted to Backblaze B2 via git-annex (type=S3, encryption=hybrid); GitHub
# holds pointers only.
#
# ADR reference: orgs/com-junkawasaki/2604-linde/docs/adr/0003-workspace-multi-project-submodule-structure.md
#                kawasakijun/docs/adr/0007-repo-reorg-orgs-layout-and-b2-persistence.md

# ─── Workspace identity ────────────────────────────────────────────

[workspace]
name = "com-junkawasaki"
owner = "Jun Kawasaki"
github = "com-junkawasaki/com-junkawasaki"
description = "Personal research workspace: formal mathematics, religious-corp substrate, AI content pipeline, AI agent platform."

