# com-junkawasaki — deps.toml
#
# Machine-readable SSoT for the com-junkawasaki workspace.
# Four projects as git submodules under projects/.
#
# ADR reference: projects/2604-linde/docs/adr/0003-workspace-multi-project-submodule-structure.md

# ─── Workspace identity ────────────────────────────────────────────

[workspace]
name = "com-junkawasaki"
owner = "Jun Kawasaki"
github = "com-junkawasaki/com-junkawasaki"
description = "Personal research workspace: formal mathematics, religious-corp substrate, AI content pipeline, AI agent platform."

# ─── Projects ──────────────────────────────────────────────────────

[[projects]]
name = "2604-linde"
path = "projects/2604-linde"
kind = "lean4-formalization"
submodule = false
description = "Lean 4 formal mathematics. Formalizes 'computation = information = physics' via Verlinde entropic gravity, Black Hole Computer, and 5-layer GenerativeStructure stack."
adrs = [
  "docs/adr/0001-computation-as-thermal-mass-blocker.md",
  "docs/adr/0002-generative-structure-from-physical-principles.md",
  "docs/adr/0003-workspace-multi-project-submodule-structure.md",
]
stack = ["Lean 4", "Mathlib"]

[[projects]]
name = "etzhayyim-root"
path = "projects/etzhayyim-root"
kind = "blockchain-substrate"
submodule = true
remote = "https://github.com/etzhayyim/root.git"
description = "Religious corporation (宗教法人 etzhayyim / 天御柱) open substrate. AT Protocol MST + IPFS + Base L2 anchor. No RisingWave. No fiat."
stack = ["TypeScript", "Rust", "Solidity", "Python", "Go"]
ssot = "projects/etzhayyim-root/deps.toml"

[[projects]]
name = "ghosthacker"
path = "projects/ghosthacker"
kind = "ai-content-pipeline"
submodule = true
remote = "git@github.com:com-junkawasaki/ghosthacker.git"
description = "Ghost Hacker Producer Pipeline. AI-driven story generation (Webtoon / Wattpad / YouTube) set in 2065 Tokyo. Merkle DAG topological execution pipeline over Neo4j story graph."
stack = ["Go", "Svelte", "Python"]
ssot = "projects/ghosthacker/mise.toml"

[[projects]]
name = "ai-gftd-apps-gftdcojp"
path = "projects/ai-gftd-apps-gftdcojp"
kind = "ai-agent-platform"
submodule = true
remote = "git@github.com:gftdcojp/ai-gftd-apps-gftdcojp.git"
description = "AI Agent-First Platform (gftd.ai). AT Protocol + Signal Protocol E2E. XRPC sole API (348 NSID), account-level Cloudflare Workers, DID-native auth."
stack = ["TypeScript", "Cloudflare Workers"]
org = "gftdcojp"
ssot = "projects/ai-gftd-apps-gftdcojp/README.md"

# ─── Personal data warehouse ───────────────────────────────────────
#
# Sensor-ingestion + encrypted storage layer for the top-level orchestrator
# (ADR-0001). Implements the "Sensors (read-only)" input as a reproducible,
# version-controlled, encrypted dataset. See ADR-0003.

[personal]
path = "personal"
kind = "personal-data-warehouse"
description = "Encrypted personal data warehouse: Mac + Android terminals, Gmail/Calendar/Drive/GitHub/1Password, SMS/calls, finance/tax/legal/property/medical, plus derived analysis. DataLad dataset; data is git-annexed (pointers only in git) and gpg-hybrid encrypted; only ciphertext is pinned to IPFS."
adrs = [
  "kawasakijun/docs/adr/0003-personal-data-warehouse-encrypted-ipfs.md",
  "kawasakijun/docs/adr/0004-account-scope-and-file-body-capture.md",
]
stack = ["DataLad", "git-annex", "gpg", "IPFS", "adb"]
sources = ["device-mac", "device-android (getprop/packages/SMS-bodies/calls/contacts)", "gmail", "google-calendar", "google-drive", "github", "1password (metadata-only inventory)"]
capture = ["metadata", "file-bodies"]   # ADR-0004: annexed binaries (drive/files/{tax,loans,contracts-corp})
analysis_artifacts = ["analysis/INDEX.md", "analysis/catalog.json", "analysis/observations.md", "analysis/financial-summary.json", "analysis/loan-ledger.json", "analysis/subscription-audit.json", "analysis/entities.json", "analysis/action-register.json", "analysis/sms-finance-timeline.jsonl"]
file_count = 132   # annexed + pinned to IPFS (encrypted); as of 2026-05-30
secrets_policy = "env var NAMES only; GitHub token VALUE not stored; 1Password = metadata only (no passwords/TOTP); SMS OTP/2FA codes redacted in derived files; data never plaintext to GitHub"
litigation_state = "kawasakijun/litigation_state.jsonld"
evidence_policy = "係争関連アカウントは削除せず保全 (ADR-0005); 正本=admin Data Export(mbox); 副本=warehouse; 改ざん封緘=SHA-256 + OpenTimestamps + git-annex"

# Google account scope & reachability (ADR-0004).
# The MCP Google connector is bound to a SINGLE OAuth session (jun784); it cannot
# switch accounts. Other accounts need their own MCP connector, Takeout, or browser login.
[[personal.account]]
id = "jun784@gmail.com"
role = "primary"
reach = "mcp"          # Gmail/Calendar/Drive connector (+ Chrome /u/0)
status = "ingested"    # full Drive inventory + 47 file-bodies + finance/calendar
[[personal.account]]
id = "root@jk.luxury"
role = "corp (jk.luxury / LingLing litigation, LATOKEN, virtual office)"
reach = "browser"      # Chrome /u/1 only; NOT on MCP
status = "pending"     # needs MCP connector or Takeout for warehouse-scale ingest
[[personal.account]]
id = "root@junkawasaki.com"
reach = "none"         # not logged into Chrome, not on MCP
status = "unreachable"
[[personal.account]]
id = "jun@gftd.group"
reach = "none"
status = "unreachable"

[personal.storage]
vcs = "datalad"
content = "git-annex (annex-ignore on origin)"
remote = "ipfs (external special remote, encryption=hybrid)"

[personal.encryption]
cipher = "gpg encryption=hybrid"
keyid = "09EE841334482F5A0F5C4958A70BB2C220DE88CA"
passphrase_custody = "macOS Keychain (gpg:personal-data)"
recovery = "1Password Private vault: 'GPG: personal-data warehouse recovery (jun784)' (armored secret key + passphrase)"

