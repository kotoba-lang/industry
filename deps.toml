# Normalized query layer (rebuildable derived index; JSONL remains source of truth).
[personal.datomic]
impl = "personal/bin/datomic (deps.edn + schema.edn + model.edn + src/warehouse/load.clj)"
engine = "com.datomic/local 1.0.291 (datomic:local, :storage-dir :mem, no transactor)"
rebuild = "cd personal/bin/datomic && clojure -M -m warehouse.load"
schema = "declarative in bin/datomic/schema.edn + schema-life.edn (ADR-0010: goal/obligation/decision/kpi/prov + person aliases); relationship graph in bin/datomic/model.edn"
views = "named Datalog views in bin/datomic/queries/attention.edn (ADR-0010 L3: attention/queue, family-signals, money-anomalies, relationship/decay, goal/blocked-critical-path, guardrail/nodoka-floor)"
provenance = "PROV-O JSON-LD sidecars: personal/prov/<cid>.prov.jsonld (ADR-0010 L2; @context = personal/prov/context.jsonld; seal-evidence.sh emits — pending)"
entities = ["org", "person", "account", "txn", "loan", "event", "action", "email", "attachment", "case", "blob", "goal", "obligation", "decision", "kpi"]
life_graph = "kawasakijun/goals.edn = SSoT of the life DAG (31 goals incl. 00_wellbecoming_self/00_nodoka_wellbeing guardrails + ADR-0014 lexicographic tiers, 26 edges; extracted from reverse_topo_pregel.py per ADR-0010 step 3) + personal/facts/obligations.jsonl (dated duties -> attention/queue). load.clj transacts both; reverse_topo_pregel.py should be switched to read goals.edn (pending)."
people_registry = "personal/facts/people.edn = curated person entities (23 canonical incl. lawyers/family/counterparties, 8 alias emails resolved via :person/canonical; relation x attention-class 2-axis). Loaded as pass-1 canonical + pass-2 alias tx."
power_dynamics = "personal/facts/dyads.edn = 9 dyads (Emerson dependence asymmetry, French&Raven bases, incentive/alignment/worst-case/lever) + 10 falsifiable hypotheses (confidence+falsifier+evidence email-cids = Shannon test agenda). Views in bin/datomic/queries/power.edn (balance/risk-dyads/levers/test-agenda). ADR-0012; family dyads = trust-investment only, never leverage."
engi = "personal/facts/engi.edn = 22 tie-release evaluations (ADR-0013: keep/reduce/transfer/archive/sever/hold; legal-hold lexicographically first; :sever requires export-first; witnesses/family never severed). Views in queries/engi.edn (sever-queue/legal-holds/savings). Estimated personal-card relief: transfer/sever ~¥153k/mo + reduce up to ~¥57k/mo vs goal-29 target -¥99k."
source_availability_note = "txn/person/loan/action sources are annex-dropped locally (encrypted content in B2 only); counts load as 0 until `git annex get analysis/ mail/` with gpg key + B2 creds"
relationships = "EAV refs: txn→vendor/account/email, person→org, account→org/owner, loan→lender, event→people, action→case/email, email→from/to/cc/mentions/case/blob/attachments, attachment→email/blob, case→parties/orgs/evidence"
loaded = { org = 110, person = 29, txn = 631, loan = 19, event = 49, action = 23, email = 1, case = 1 }
known_issues = ["txn double-count across 8 finance files (need dedup-key=date+vendor+amount)", "loan-ledger total ¥10.75M vs agreement detail sum ¥7.89M mismatch (recompute from detail)"]

# Raw email store: content-addressed (cid=sha256) .eml under git-annex -> B2.
[personal.mail_store]
format = "RFC822 .eml, content-addressed (cid = sha256 hex)"
path = "personal/mail/messages/<cid>.eml  (git-annex MD5E, encryption=hybrid -> Backblaze B2)"
index = "personal/mail/messages/index.jsonl  (cid <-> message_id <-> thread <-> from/to/cc/subject/labels)"
ingest = "pipe MCP get_thread FULL_CONTENT JSON to personal/bin/ingest-eml.py (idempotent by cid)"
status = "bootstrapped 2026-06-09: 1 message backfilled (LingLing ETH NEO 175623 evidence). Derived finance/litigation jsonl remain the metadata layer; .eml is the raw/cid layer."
note = "Before this, mail was derived-metadata jsonl only (no raw bodies, no cid/eml). cid/eml + edn relationships added per user request."

