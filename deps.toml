# ─── Personal data warehouse ───────────────────────────────────────
#
# Sensor-ingestion + encrypted storage layer for the top-level orchestrator
# (ADR-0001). Implements the "Sensors (read-only)" input as a reproducible,
# version-controlled, encrypted dataset. See ADR-0003.

[personal]
path = "personal"
kind = "personal-data-warehouse"
description = "Encrypted personal data warehouse: Mac + Android terminals, Gmail/Calendar/Drive/GitHub/1Password, SMS/calls, finance/tax/legal/property/medical, plus derived analysis. DataLad dataset; data is git-annexed (pointers only in git) and gpg-hybrid encrypted; persisted to private Backblaze B2 + local clones ONLY (no public-network pinning — IPFS retired 2026-06-11 per ADR-0011, quantum harvest-now-decrypt-later threat model)."
adrs = [
  "kawasakijun/docs/adr/0003-personal-data-warehouse-encrypted-ipfs.md",
  "kawasakijun/docs/adr/0004-account-scope-and-file-body-capture.md",
  "kawasakijun/docs/adr/0005-legal-evidence-preservation.md",
  "kawasakijun/docs/adr/0010-life-graph-edn-datalog-provo.md",
  "kawasakijun/docs/adr/0011-no-public-network-pinning-pqc.md",
  "kawasakijun/docs/adr/0012-power-dynamics-model.md",
  "kawasakijun/docs/adr/0013-engi-release-model.md",
  "kawasakijun/docs/adr/0014-vonneumann-lexicographic-criterion.md",
]
stack = ["DataLad", "git-annex", "gpg", "adb", "Datomic Local (Clojure)"]
sources = ["device-mac", "device-android (getprop/packages/SMS-bodies/calls/contacts)", "gmail", "google-calendar", "google-drive", "github", "1password (metadata-only inventory)"]
capture = ["metadata", "file-bodies"]   # ADR-0004: annexed binaries (drive/files/{tax,loans,contracts-corp})
analysis_artifacts = ["analysis/INDEX.md", "analysis/catalog.json", "analysis/observations.md", "analysis/financial-summary.json", "analysis/loan-ledger.json", "analysis/subscription-audit.json", "analysis/entities.json", "analysis/action-register.json", "analysis/sms-finance-timeline.jsonl", "analysis/datomic-report.md"]
file_count = 133   # annexed -> B2 (encrypted); as of 2026-05-31
secrets_policy = "env var NAMES only; GitHub token VALUE not stored; 1Password = metadata only (no passwords/TOTP); SMS OTP/2FA codes redacted in derived files; data never plaintext to GitHub"
litigation_state = "kawasakijun/litigation_state.jsonld"
evidence_policy = "係争関連アカウントは削除せず保全 (ADR-0005); 正本=admin Data Export(mbox); 副本=warehouse; 改ざん封緘=SHA-256 + OpenTimestamps + git-annex"

