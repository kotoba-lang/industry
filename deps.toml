# ─── Project relationships ─────────────────────────────────────────
#
#   2604-linde (theory)  →  etzhayyim-root (substrate)  →  ghosthacker (application)
#                        ↘  ai-gftd-apps-gftdcojp (platform)
#
#   2604-linde formalizes "computation = information = physics".
#   etzhayyim-root applies those principles to on-chain distributed systems.
#   ghosthacker runs on that substrate to generate the Ghost Hacker story universe.
#   ai-gftd-apps-gftdcojp is the production AI agent platform (gftd.ai) built on AT Protocol.
