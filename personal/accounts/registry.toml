# personal/accounts/registry.toml — declarative registry of all personal accounts.
# Git plaintext (see .gitattributes). NO SECRETS here — tokens/passphrases live in
# macOS Keychain / 1Password. Consumed by bin/registry, which feeds
# takeout-watcher.sh / takeout-status.sh (and future ingest tasks).

# Per-account [accounts.<slug>.mail] enables periodic incremental ingest by
# bin/mail-sync.sh (launchd daily). window = sliding Gmail re-scan window
# (overlap is fine — ingest is idempotent by message id / content hash).
# Auth bootstrap (one-time per account): bin/google-auth.py login <slug>
#
# OAuth (google): GCP project personal-warehouse-jk (External/Testing); desktop
#   client + refresh tokens live ONLY in macOS Keychain (google-oauth-client /
#   google-oauth:<slug>). 4 Google accounts registered as test users.
# OAuth (microsoft): Entra public client (TODO); tokens in Keychain
#   (msgraph-oauth-client / msgraph-oauth:<slug>).
#
# auth status (2026-06-10) — mail.sync=true is the INTENT; actual token presence
# is authoritative via `bin/google-auth.py status` / `bin/msgraph-auth.py status`.
#   jun784        ✅ authorized + ingested (487 msgs)
#   jk-luxury     ✅ authorized + ingested (73 msgs)
#   gftd-group    ⏳ pending: not signed into Chrome; run `google-auth.py login gftd-group`
#   junkawasaki-com ⏳ pending: same — `google-auth.py login junkawasaki-com`
#   gftd-co-jp    ⏳ pending: Entra app registration + `msgraph-auth.py login gftd-co-jp`

[accounts.jun784]
email = "jun784@gmail.com"
provider = "google"
[accounts.jun784.mail]
sync = true
window = "14d"
authorized = true # 2026-06-10

[accounts.jk-luxury]
email = "root@jk.luxury"
provider = "google"
[accounts.jk-luxury.mail]
sync = true
window = "14d"
authorized = true # 2026-06-10

[accounts.gftd-group]
email = "jun@gftd.group"
provider = "google" # Workspace — Takeout requires admin enablement
[accounts.gftd-group.mail]
sync = true
window = "14d"
authorized = false # pending login (account not signed into Chrome)

[accounts.junkawasaki-com]
email = "root@junkawasaki.com"
provider = "google"
[accounts.junkawasaki-com.mail]
sync = false
window = "14d"
authorized = false # pending login (account not signed into Chrome)

[accounts.gftd-co-jp]
email = "j.kawasaki@gftd.co.jp"
provider = "microsoft" # M365 — mail/calendar via Graph API, files via rclone onedrive
[accounts.gftd-co-jp.mail]
sync = true # ingest-graph-mail.py; bootstrap: msgraph-auth.py client-set + login gftd-co-jp
window = "14d"
authorized = false # pending Entra app registration

# ── Takeout jobs ─────────────────────────────────────────────────────────────
# One table per Google Takeout export job. The watcher routes ~/Downloads zips
# by this job-timestamp prefix to personal/takeout/<account>/<date>/.
# Adding a table here is picked up live by the running watcher (re-read each pass).
#   parts = expected number of zip parts (for status display)

[takeout."takeout-20260610T103007Z"]
