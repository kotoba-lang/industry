# gftd-keiei-sim — gftdcojp 経営シミュレーションゲーム (MVP)
#
# 意思決定者（あなた）が判断し、LLMエージェント社員が提案する経営シム。
# 状態SSoT = kotoba-datomic / 社員 = kotoba-clj defgraph エージェント /
# 推論 = 実LLM (kotoba-llm HttpInferEngine) / 可視化 = Web ダッシュボード。
#
# kotoba は別ワークスペース (../../etzhayyim/kotoba) なので path dep で参照する。
# 空の [workspace] テーブルで祖先ワークスペースに吸収されるのを防ぎ、独立 crate にする。
[package]
name = "gftd-keiei-sim"
version = "0.1.0"
edition = "2021"
description = "gftdcojp management simulation game — datomic SSoT + clj agent employees + real LLM + web dashboard"

[workspace]

[[bin]]
name = "gftd-keiei-sim"
path = "src/main.rs"

[dependencies]
kotoba-datomic = { path = "../../etzhayyim/kotoba/crates/kotoba-datomic" }
kotoba-edn     = { path = "../../etzhayyim/kotoba/crates/kotoba-edn" }
kotoba-clj     = { path = "../../etzhayyim/kotoba/crates/kotoba-clj", features = ["component"] }
kotoba-runtime = { path = "../../etzhayyim/kotoba/crates/kotoba-runtime" }

tokio  = { version = "1", features = ["full"] }
axum   = "0.7"
tower-http = { version = "0.5", features = ["fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
serde  = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
ureq = { version = "2", features = ["json"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
