# Taskfile for com-junkawasaki — top-level orchestrator
# Install Task: https://taskfile.dev/installation/
# Usage: `task <name>` or `task --list`

version: '3'

vars:
  PY: kawasakijun/.venv/bin/python
  KJ: kawasakijun

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list-all

  # ============= Planning / Analysis =============
  plan:
    desc: Run reverse-topological Pregel planner (10y budget)
    cmds:
      - "{{.PY}} {{.KJ}}/reverse_topo_pregel.py --budget-years 10 --out {{.KJ}}/plan_10y.md"

  plan-12y:
    desc: Run planner with 12y budget
    cmds:
      - "{{.PY}} {{.KJ}}/reverse_topo_pregel.py --budget-years 12 --out {{.KJ}}/plan_12y.md"

  cpm:
    desc: Critical Path Method analysis (ES / EF / Slack)
    cmds:
      - "{{.PY}} {{.KJ}}/phase2_critical_path.py --out {{.KJ}}/critical_path.md"

  accel:
    desc: Acceleration scenarios (S1 / S2 / S3)
    cmds:
      - "{{.PY}} {{.KJ}}/phase2_acceleration.py --out {{.KJ}}/acceleration.md"

  analyze:
    desc: Run plan + cpm + accel together
    cmds:
      - task: plan
      - task: cpm
      - task: accel

  # ============= Living System =============
  living-dry:
    desc: Living System dry-run (no API calls)
    cmds:
      - "{{.PY}} {{.KJ}}/living/run.py --dry-run"

  living-collect:
    desc: Print collected sensor state only
    cmds:
      - "{{.PY}} {{.KJ}}/living/run.py --collect-only"

  living-execute:
    desc: 'EXECUTE: emit real issues / events / drafts. Use with care.'
    cmds:
      - "{{.PY}} {{.KJ}}/living/run.py --execute"

  kpi:
    desc: KPI sensor report (git activity etc.)
    cmds:
      - "{{.PY}} {{.KJ}}/phase2_kpi_sensors.py --out {{.KJ}}/kpi_report.md"

  # ============= Setup =============
  install:
    desc: Set up Python venv + dependencies
    cmds:
      - python3 -m venv {{.KJ}}/.venv
      - "{{.KJ}}/.venv/bin/pip install --upgrade pip"
      - "{{.KJ}}/.venv/bin/pip install -e {{.KJ}}"

  # ============= Subscription audit =============
  subs-status:
    desc: Show subscription audit summary (KEEP / REVIEW / CANCEL / EXPIRED)
    cmds:
      - |
        {{.PY}} -c "
        import json
        with open('{{.KJ}}/subscriptions_state.jsonld') as f:
            data = json.load(f)
        s = data.get('kj:summary_by_verdict', {})
        print('=== Subscription audit summary ===')
        for k, v in s.items():
            print(f'  {k}: {v}')
        print()
        print('=== Cancellation log ===')
        for entry in data.get('kj:cancellation_log', []):
            print(f\"- {entry.get('service')}: {entry.get('status')}\")"

  subs-pending:
    desc: List REVIEW (pending decision) subscriptions
    cmds:
      - |
        {{.PY}} -c "
        import json
        with open('{{.KJ}}/subscriptions_state.jsonld') as f:
            data = json.load(f)
        review = [it for it in data['itemListElement']
                  if it.get('verdict') == 'REVIEW']
        print(f'=== REVIEW ({len(review)} items) ===')
        for it in review:
            note = it.get('note', '')
            print(f\"- {it.get('name')}: {note}\")"

  # ============= Git workflow =============
  status:
    desc: Show git status + recent commits
    cmds:
      - git status -s
      - echo '---'
      - git log --oneline -10

  push:
    desc: Push current branch to origin
    cmds:
      - git push origin $(git branch --show-current)

  # ============= Documentation =============
  adr-list:
    desc: List ADRs under kawasakijun/docs/adr/
    cmds:
      - ls -1 {{.KJ}}/docs/adr/

  phases:
    desc: List phase files
    cmds:
      - ls -1 {{.KJ}}/phase*.md
