[package]
name = "densha"
version = "0.1.0"
edition = "2021"
description = "Next.js-like web application framework built with Kotoba"
authors = ["Jun Kawasaki <jun784@example.com>"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
hyper = { version = "0.14", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
tower = "0.4"
tower-http = { version = "0.4", features = ["fs", "cors"] }
http = "0.2"
futures = "0.3"
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1.0", features = ["full", "macros"] }
tracing = "0.1"
tracing-subscriber = "0.3"
notify = "6.0"
walkdir = "2.0"
mime_guess = "2.0"
handlebars = "4.3"
regex = "1.7"
# CSS processing for Tailwind
lightningcss = "1.0.0-alpha.67"
# Additional utilities
comrak = "0.18"  # Markdown processing
syntect = "5.0"  # Syntax highlighting
base64 = "0.21"
uuid = { version = "1.0", features = ["v4"] }
toml = "0.8"  # TOML configuration support
rustc_version = "0.4"  # Rust version detection

# JSONnet support via external command
# Note: Using external jsonnet command for processing

# Kotoba framework dependencies - temporarily commented out for compatibility
# kotoba-core = { git = "https://github.com/jun784/kotoba", branch = "main" }
# kotoba-web = { git = "https://github.com/jun784/kotoba", branch = "main" }
# kotoba-query = { git = "https://github.com/jun784/kotoba", branch = "main" }
# kotoba-types = { git = "https://github.com/jun784/kotoba", branch = "main" }

# Additional dependencies for Prehender
chrono = { version = "0.4", features = ["serde"] }
lazy_static = "1.4"

[dev-dependencies]
tempfile = "3.0"

[[bin]]
name = "densha"
path = "src/main.rs"
