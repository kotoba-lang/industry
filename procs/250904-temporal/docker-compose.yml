version: '3.8'
services:
  # Temporal Server
  temporal:
    image: temporalio/server:1.26.3
    container_name: temporal-server
    ports:
      - "7233:7233"  # gRPC port
      - "7234:7234"  # HTTP port
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal_password
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development.yaml
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    depends_on:
      - postgres
    networks:
      - temporal-network

  # PostgreSQL Database
  postgres:
    image: postgres:13
    container_name: temporal-postgres
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal_password
      - POSTGRES_DB=temporal
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - temporal-network

  # Temporal Admin Tools
  temporal-admin-tools:
    image: temporalio/admin-tools:latest
    container_name: temporal-admin-tools
    depends_on:
      - temporal
    environment:
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    stdin_open: true
    tty: true
    networks:
      - temporal-network

  # Temporal Web UI
  temporal-web:
    image: temporalio/web:latest
    container_name: temporal-web-ui
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8080
    ports:
      - "8080:8080"
    depends_on:
      - temporal
    networks:
      - temporal-network

volumes:
  postgres-data:
    driver: local

networks:
  temporal-network:
    driver: bridge
