apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-activity
  namespace: llm-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llm-activity
  template:
    metadata:
      labels:
        app: llm-activity
    spec:
      containers:
      - name: llm
        image: your-repo/llm-activity:latest  # Replace with your Docker image
        ports:
        - containerPort: 8080
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-secret
              key: api-key
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "2Gi"
