<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spirit in Physics - 3D ビジュアライザー</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      overflow: hidden;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 300px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 20px;
      overflow-y: auto;
    }

    .main {
      flex: 1;
      position: relative;
    }

    .title {
      font-size: 1.5em;
      margin-bottom: 20px;
      text-align: center;
    }

    .parameter-group {
      margin-bottom: 20px;
    }

    .parameter-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .parameter-group input {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.9);
      color: #333;
    }

    .stats {
      margin-top: 20px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
    }

    .word-list {
      max-height: 300px;
      overflow-y: auto;
      margin-top: 20px;
    }

    .word-item {
      padding: 5px;
      margin: 2px 0;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .word-item:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    #canvas-container {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <div class="title">Spirit in Physics</div>

      <div class="parameter-group">
        <label for="alpha">反応速度 (α)</label>
        <input type="range" id="alpha" min="0.1" max="3.0" step="0.1" value="1.0">
        <span id="alpha-value">1.0</span>
      </div>

      <div class="parameter-group">
        <label for="gamma">皮膚電位 (γ)</label>
        <input type="range" id="gamma" min="0.1" max="3.0" step="0.1" value="1.0">
        <span id="gamma-value">1.0</span>
      </div>

      <div class="parameter-group">
        <label for="eta">表情感情 (η)</label>
        <input type="range" id="eta" min="0.1" max="3.0" step="0.1" value="1.0">
        <span id="eta-value">1.0</span>
      </div>

      <div class="parameter-group">
        <label for="lambda">スケール係数 (λ)</label>
        <input type="range" id="lambda" min="0.1" max="3.0" step="0.1" value="1.0">
        <span id="lambda-value">1.0</span>
      </div>

      <div class="stats">
        <h3>統計情報</h3>
        <div id="stats-content">
          データを読み込み中...
        </div>
      </div>

      <div class="word-list">
        <h3>単語リスト</h3>
        <div id="word-list-content"></div>
      </div>
    </div>

    <div class="main">
      <div id="canvas-container"></div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "three": "https://unpkg.com/three@0.148.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.148.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
