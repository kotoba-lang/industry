[package]
name = "kawa-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "High-performance storage engine for Kawa message broker"
license.workspace = true
repository.workspace = true
keywords = ["storage", "database", "performance", "messaging"]
categories = ["database", "concurrency"]

[dependencies]
# Core dependencies
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
derive_more = { workspace = true }
bytes = { workspace = true, features = ["serde"] }
memmap2 = "0.9"
crc32fast = "1.3"

# Additional dependencies for storage
uuid = { version = "1.6", features = ["v4", "serde"] }
bincode = "1.3"
base64 = "0.22"

# 高性能非同期処理
futures = "0.3"

# ファイルI/O
tempfile = "3.0"

# 圧縮
snap = { version = "1", optional = true }

# ★ 追加: Ultra Performance Engine用依存関係
# Lock-free データ構造
crossbeam-queue = "0.3"
crossbeam-utils = "0.8"
num_cpus = "1.17.0"

# SIMD最適化
# portable-simd = { version = "0.3", features = ["generic_const_exprs"] }  # nightly用

# NUMA最適化（将来実装用）
# numa = "0.1"  # Linux専用

# GPU加速（将来実装用）
# wgpu = "0.18"  # WebGPU
# cudarc = "0.10"  # CUDA（オプション）

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
tempfile = "3.8"
tokio-test = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = ["ultra-performance", "gpu-acceleration"]
ultra-performance = []
gpu-acceleration = []  # Phase 2実装
numa-optimization = []  # 将来実装
compression = ["snap"]

[[bench]]
name = "redpanda_killer"
harness = false

[[bench]]
name = "gpu_acceleration_bench"
harness = false 
