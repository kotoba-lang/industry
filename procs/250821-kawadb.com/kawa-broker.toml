[network]
bind_address = "0.0.0.0"
bind_port = 9092
enable_tls = false
tcp_nodelay = true
so_reuseaddr = true
recv_buffer_size = 65536
send_buffer_size = 65536

[storage]
data_dir = "./data"
segment_size = 1073741824
sync_interval_ms = 1000
enable_compression = false
retention_days = 7

[auth]
enable_sasl = false
sasl_mechanisms = [
    "PLAIN",
    "SCRAM-SHA-256",
    "SCRAM-SHA-512",
]
enable_acl = false
allow_anonymous = true

[performance]
max_connections = 1000
session_timeout_secs = 300
request_timeout_ms = 30000
max_request_size = 1048576
buffer_pool_size = 67108864
max_batch_size = 500

[logging]
level = "info"
enable_console = true
enable_file = false
file_path = "./logs/kawa-broker.log"
enable_rotation = true
max_file_size = 104857600
max_files = 10
json_format = false

[management]
enable = true
bind_address = "127.0.0.1"
bind_port = 8080
enable_metrics = true
enable_health_check = true
enable_auth = false
