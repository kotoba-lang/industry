[workspace]
resolver = "2"
members = [
    "kawa-broker",
    "kawa-storage", 
    "kawa-cli",
    "kawa-db",
    "kawa-wasm",
    "kawa-serialization",
    # TODO: 将来実装予定
    # "kawa-projection",
    # "kawa-auth",
    # "kawa-ctl"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Kawasaki"]
license = "KawaDB Community License"
license-file = "LICENSE"
repository = "https://github.com/jun784/kawadb.com"
homepage = "https://github.com/jun784/kawadb.com"

[workspace.dependencies]
# Common dependencies
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
derive_more = "0.99"

# Network and async
mio = "0.8"
bytes = "1.0"

# Kafka protocol
rdkafka = "0.37"

# Storage
sled = "0.34"
memmap2 = "0.9"
crc32fast = "1.3"

# Database and SQL
sqlparser = "0.57"
datafusion = "48.0"
arrow = "55.0"
parquet = "55.0"

# WASM runtime and bindings
wasmtime = "14.0"
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"
js-sys = "0.3.77"
web-sys = "0.3.77"
console_error_panic_hook = "0.1"
serde-wasm-bindgen = "0.6"

# Additional WASM test support
wasm-bindgen-test = "0.3.50"

# Authentication and authorization  
jsonwebtoken = "9.1"
openidconnect = "3.4"
oauth2 = "4.4"

# CLI
clap = { version = "4.0", features = ["derive"] }

# Kubernetes
kube = "0.87"
k8s-openapi = { version = "0.20", features = ["v1_28"] }

# Testing
proptest = "1.0"
criterion = "0.5" 