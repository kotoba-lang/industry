name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Check code
      run: cargo check --all-targets --workspace

    - name: Run tests
      run: cargo test --all-targets --workspace -- --test-threads=1 