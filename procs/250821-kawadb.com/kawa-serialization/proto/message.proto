syntax = "proto3";

package kawa.serialization;

// Kawaメッセージエンベロープ
message KawaMessage {
  // メッセージのバイナリデータ
  bytes data = 1;
  
  // エンコーディング形式
  string encoding = 2;
  
  // タイムスタンプ（Unix時間）
  int64 timestamp = 3;
  
  // データサイズ（バイト）
  uint32 size = 4;
  
  // スキーマフィンガープリント
  string schema_fingerprint = 5;
  
  // カスタムメタデータ
  map<string, string> metadata = 6;
  
  // チェックサム（オプション）
  optional string checksum = 7;
}

// シンプルメッセージ（メタデータなし）
message SimpleMessage {
  // メッセージのバイナリデータ
  bytes data = 1;
} 