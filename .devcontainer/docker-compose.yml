version: '3.8'

services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces:cached
      - node_modules:/workspaces/apps/webmaster/node_modules
      - node_modules_cytoscaper:/workspaces/apps/cytoscaper/node_modules
      - python_cache:/root/.cache/pip
      - pnpm_cache:/root/.pnpm-store
    command: sleep infinity
    environment:
      - NODE_ENV=development
      - PYTHONPATH=/workspaces/apps/research
    ports:
      - "1016:1016"    # Webmaster
      - "25720:25720"  # Cytoscaper
      - "3000:3000"    # Default Next.js
      - "8000:8000"    # Python dev server
      - "8888:8888"    # Jupyter notebook
    networks:
      - junkawasaki-network

  # PostgreSQL for development (if needed)
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: junkawasaki_dev
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - junkawasaki-network

  # Redis for caching (if needed)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - junkawasaki-network

volumes:
  node_modules:
  node_modules_cytoscaper:
  python_cache:
  pnpm_cache:
  postgres_data:
  redis_data:

networks:
  junkawasaki-network:
    driver: bridge 